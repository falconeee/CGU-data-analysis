[project]
name = "cgu-data-analysis"
version = "0.1.0"
description = "Detecção de anomalias e indícios de fraude em contratações públicas, com dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pandera>=0.20",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "faker>=26",
    "httpx>=0.27",
    "tenacity>=8.5",
    "typer>=0.12",
    "pyyaml>=6",
    "python-dotenv>=1",
    "streamlit>=1.38",
    "plotly>=5.22",
    "pyvis>=0.3.2",
]

[project.scripts]
cgu = "cgu.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cgu"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["cgu", "common", "conftest"]
